<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Objectifs">
<meta name="theme-color" content="#FAFAFA">
<title>Objectifs 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="mainView">
    <header class="topbar">
      <h1>Objectifs 2026</h1>
      <button id="menuBtn" class="icon-btn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
      </button>
    </header>

    <main>
      <section class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="stat-value" id="statTotal">0</span><span class="stat-label">objectifs</span></div>
          <div class="stat"><span class="stat-value" id="statDone">0</span><span class="stat-label">terminés</span></div>
          <div class="stat"><span class="stat-value" id="statOngoing">0</span><span class="stat-label">en cours</span></div>
        </div>
        <div class="global-progress">
          <div class="global-progress-track">
            <div class="global-progress-fill" id="globalProgressFill"></div>
          </div>
          <span class="global-progress-label" id="globalProgressLabel">0 %</span>
        </div>
      </section>

      <nav class="filters" id="filters" aria-label="Filtrer par catégorie">
        <button class="filter-chip active" data-category="all">Tout</button>
      </nav>

      <section class="goal-list" id="goalList"></section>

      <p class="empty-state" id="emptyState" hidden>Aucun objectif ici. Ajoute-en un avec le bouton +.</p>
    </main>

    <button id="addBtn" class="fab" aria-label="Ajouter un objectif">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Page Réglages (pas un popup, une vraie page) -->
  <div id="settingsView" hidden>
    <header class="topbar">
      <button id="settingsBack" class="icon-btn back-btn" aria-label="Retour">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Réglages</h1>
      <span class="icon-btn-spacer"></span>
    </header>
    <main>
      <div class="settings-list">
        <button class="menu-item" id="exportBtn">Exporter les données (JSON)</button>
        <label class="menu-item" for="importInput">Importer des données (JSON)</label>
        <input type="file" id="importInput" accept="application/json" hidden>
        <button class="menu-item menu-item-danger" id="resetBtn">Réinitialiser les données</button>
      </div>
    </main>
  </div>

  <!-- Formulaire d'ajout / édition -->
  <div class="sheet-overlay" id="formOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="text-btn" id="formCancel">Annuler</button>
        <h2 id="formTitle">Nouvel objectif</h2>
        <button class="text-btn text-btn-primary" id="formSave">Enregistrer</button>
      </div>
      <form id="goalForm" class="sheet-body">
        <label class="field">
          <span>Nom</span>
          <input type="text" id="fName" required maxlength="80" placeholder="Ex : Voyager à Amsterdam">
        </label>

        <label class="field">
          <span>Catégorie</span>
          <select id="fCategory"></select>
        </label>

        <div class="field">
          <span>Type</span>
          <div class="segmented" id="fType">
            <button type="button" class="segment active" data-type="binary">Binaire</button>
            <button type="button" class="segment" data-type="progress">Progression</button>
          </div>
        </div>

        <div id="progressFields" class="progress-fields" hidden>
          <label class="field field-half">
            <span>Valeur actuelle</span>
            <input type="number" id="fCurrent" min="0" step="any" placeholder="0">
          </label>
          <label class="field field-half">
            <span>Valeur cible</span>
            <input type="number" id="fTarget" min="0" step="any" placeholder="1000">
          </label>
          <label class="field">
            <span>Unité (optionnel)</span>
            <input type="text" id="fUnit" maxlength="10" placeholder="€">
          </label>
        </div>

        <label class="field">
          <span>Deadline (optionnel)</span>
          <input type="date" id="fDeadline">
        </label>

        <label class="field">
          <span>Note (optionnel)</span>
          <input type="text" id="fNote" maxlength="120" placeholder="Ex : idéalement à l'étranger">
        </label>

        <button type="button" id="formDelete" class="delete-btn" hidden>Supprimer l'objectif</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
